<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ytpipe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 12px;
      background: #fff;
      color: #222;
      width: 340px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      user-select: none;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #111;
    }

    .section {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
    }

    .section:last-of-type {
      border-bottom: none;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }

    .row .label {
      color: #666;
    }

    .row .value {
      color: #222;
      font-weight: 500;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row .value.muted {
      color: #999;
      font-weight: 400;
    }

    .feed-url-box {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 6px 8px;
      font-family: Consolas, monospace;
      font-size: 11px;
      word-break: break-all;
      line-height: 1.4;
      margin: 4px 0 6px 0;
      max-height: 52px;
      overflow-y: auto;
      color: #444;
    }

    .btn-group {
      display: flex;
      gap: 4px;
    }

    .btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #bbb;
      border-radius: 2px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      background: #fff;
      color: #333;
    }

    .btn:hover {
      background: #f0f0f0;
    }

    .btn:active {
      background: #e5e5e5;
    }

    .btn.primary {
      background: #c00;
      color: #fff;
      border-color: #a00;
    }

    .btn.primary:hover {
      background: #a00;
    }

    .btn.copied {
      background: #2e7d32;
      color: #fff;
      border-color: #1b5e20;
    }

    .footer {
      padding: 8px 12px;
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 6px;
    }

    .footer .btn {
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" width="20" height="20" alt="">
    <h1>ytpipe</h1>
  </div>

  <div class="section">
    <div class="section-title">Instance</div>
    <div class="row">
      <span class="label">Piped</span>
      <span class="value" id="pipedDisplay">—</span>
    </div>
    <div class="row">
      <span class="label">Homepage redirect</span>
      <span class="value" id="homepageDisplay">—</span>
    </div>
    <div class="row">
      <span class="label">Redirect /feed</span>
      <span class="value" id="feedDisplay">—</span>
    </div>
    <div class="row">
      <span class="label">Redirect /trending</span>
      <span class="value" id="trendingDisplay">—</span>
    </div>
  </div>

  <div class="section" id="channelSection" style="display:none">
    <div class="section-title">Channel Feed</div>
    <div class="row">
      <span class="label">Channel</span>
      <span class="value" id="channelName">—</span>
    </div>
    <div class="row">
      <span class="label">ID</span>
      <span class="value" id="channelId" style="font-family:Consolas,monospace;font-size:11px;color:#666">—</span>
    </div>
    <div class="feed-url-box" id="feedUrl">—</div>
    <div class="btn-group">
      <button class="btn" id="copyFeedUrl">Copy URL</button>
      <button class="btn" id="downloadOpml">OPML</button>
    </div>
  </div>

  <div class="footer">
    <button class="btn primary" id="openOptions">Settings</button>
    <button class="btn" id="openPiped">Open Piped</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
